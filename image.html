<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* شريط الملاحة الأعلى */
        .navbar {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
            gap: 15px;
        }

        .navbar a {
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* الحاوية الرئيسية */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 70px;
            font-weight: bold;
            font-family: 'Product Sans', sans-serif;
        }

        .sub-logo {
            color: #4285F4;
            font-size: 16px;
            position: absolute;
            bottom: -5px;
            left: 0;
            font-weight: bold;
        }

        /* نموذج البحث */
        .search-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 580px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-sizing: border-box;
        }

        .search-input:hover, .search-input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .buttons {
            margin-top: 20px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            color: #202124;
        }
    </style>
</head>
<body>

    <!-- رابط العودة للبحث العادي -->
    <div class="navbar">
        <a href="index.html">Search on google</a>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <div class="logo-container">
            <div class="logo">
                <span style="color: #4285F4;">G</span>
                <span style="color: #EA4335;">o</span>
                <span style="color: #FBBC05;">o</span>
                <span style="color: #4285F4;">g</span>
                <span style="color: #34A853;">l</span>
                <span style="color: #EA4335;">e</span>
            </div>
            <span class="sub-logo">Photos</span>
        </div>

        <!-- نموذج بحث الصور -->
        <form class="search-form" action="https://www.google.com/search" method="get">
            <input type="text" name="q" class="search-input" placeholder="...Search on images" required autocomplete="off">
            
            <input type="hidden" name="tbm" value="isch">

            <div class="buttons">
                <input type="submit" value="Image" class="btn">
            </div>
        </form>
    </div>

</body>
</html>
